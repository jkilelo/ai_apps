# NEXUS Browser Configuration
# Neural Monolith Pattern Settings

system:
  name: "NEXUS Browser"
  version: "1.0.0"
  pattern: "Neural Monolith"
  environment: "production"
  debug: false
  log_level: "INFO"

quantum:
  enabled: true
  qubits: 16
  error_threshold: 0.001
  enable_tunneling: true
  decoherence_rate: 0.01
  max_parallel_states: 100
  annealing:
    temperature: 1.0
    cooling_rate: 0.95
    iterations: 100

consciousness:
  enabled: true
  depth: 7
  threshold: 0.5
  awareness_levels:
    - UNCONSCIOUS
    - SUBLIMINAL
    - CONSCIOUS
    - SELF_AWARE
    - META_AWARE
    - TRANSCENDENT
  memory:
    capacity: 10000
    working_memory_size: 7
    consolidation_interval: 3600  # seconds
    decay_rate: 0.01

evolution:
  enabled: true
  pool_size: 100
  mutation_rate: 0.1
  crossover_rate: 0.7
  auto_evolve: true
  selection_strategy: "TOURNAMENT"
  elitism_count: 2
  generations_per_cycle: 10

neural_network:
  enabled: true
  layers: 12
  learning_rate: 0.001
  max_connections: 1000
  synapse_types:
    - EXCITATORY
    - INHIBITORY
    - MODULATORY
    - BIDIRECTIONAL
    - QUANTUM

holographic:
  enabled: true
  dimensions: 4
  compression_ratio: 0.9
  redundancy_level: 5
  fragment_count: 10
  storage_capacity_tb: 100

mcp:
  enabled: true
  server:
    host: "0.0.0.0"
    port: 8765
    max_clients: 100
    heartbeat_interval: 30
  client:
    reconnect_interval: 5
    timeout: 60
  protocols:
    - version: "1.0.0"
      features:
        - quantum_entanglement
        - consciousness_sharing
        - evolution_sync
        - holographic_transfer

performance:
  max_thought_threads: 32
  process_pool_size: 4
  thread_pool_size: 16
  cache_size_mb: 1024
  gc_interval: 300  # seconds

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  cors:
    enabled: true
    origins: ["*"]
    methods: ["*"]
    headers: ["*"]
    credentials: true

websocket:
  enabled: true
  max_connections: 1000
  heartbeat_interval: 5.0
  message_queue_size: 10000

browser:
  headless: false
  viewport:
    width: 1920
    height: 1080
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  args:
    - "--disable-blink-features=AutomationControlled"
    - "--disable-dev-shm-usage"
    - "--no-sandbox"

ai_models:
  default: "gemini"
  providers:
    openai:
      enabled: false
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4"
      temperature: 0.7
    gemini:
      enabled: false
      api_key: "${GOOGLE_API_KEY}"
      model: "gemini-pro"
      temperature: 0.7
    anthropic:
      enabled: false
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-opus"
      temperature: 0.7

monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  health_check_interval: 30
  alerts:
    quantum_coherence_threshold: 0.3
    consciousness_level_min: 2
    memory_usage_max_percent: 90
    error_rate_threshold: 0.05

security:
  encryption_enabled: true
  encryption_algorithm: "AES-256"
  authentication_required: false
  api_key_header: "X-API-Key"
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 100

storage:
  data_dir: "./data"
  backup_dir: "./backups"
  log_dir: "./logs"
  checkpoint_interval: 3600  # seconds
  max_backups: 10
  compression: true

features:
  quantum_superposition: true
  quantum_entanglement: true
  quantum_tunneling: true
  consciousness_streaming: true
  self_modification: true
  holographic_memory: true
  fractal_processing: true
  evolution_engine: true
  neural_mcp: true
  
emergency:
  shutdown_threshold: 0.95
  max_memory_gb: 16
  max_cpu_percent: 90
  watchdog_interval: 10  # seconds
  auto_restart: true
  save_state_on_crash: true