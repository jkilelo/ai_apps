[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stealth-browser"
# Alpha release version tag
version = "0.1.0a1"
description = "The most advanced AI-first stealth browser automation system"
authors = [{name = "AI Stealth Browser Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
	"playwright>=1.40.0",
	"pydantic>=2.5.0",
	"pydantic-ai>=0.0.13",
	"httpx",
	"beautifulsoup4",
	"lxml",
	"fake-useragent",
	"undetected-chromedriver",
	"python-dotenv>=1.0.0"
]

classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Topic :: Internet :: WWW/HTTP :: Browsers",
	"Topic :: Software Development :: Testing",
	"Topic :: Security",
]

[project.scripts]
ai-stealth-browser = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "stealth*", "utils*", "mcp*", "docs*"]

[tool.setuptools.package-data]
stealth = ["scripts/*.js"]

[project.optional-dependencies]
dev = [
	"pytest>=7.0.0",
	"pytest-asyncio",
	"pytest-cov",
	"black",
	"isort",
	"mypy",
	"flake8",
	"pre-commit",
	"ruff",
	"pyright"
]

[tool.uv]
dev-dependencies = [
	"pytest>=7.0.0",
	"pytest-asyncio",
	"pytest-cov",
	"black",
	"isort",
	"mypy",
	"flake8",
	"pre-commit",
	"ruff",
	"pyright"
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing"
