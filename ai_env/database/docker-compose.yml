# PostgreSQL 18 Configuration for AI-Driven Database Management
# Following AI_DRIVEN_POSTGRESQL_AUDIT.md specifications

version: '3.8'

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

services:
  postgres18:
    # Using PostgreSQL 17 as PG18 final release is not yet available (Sept 25, 2025)
    # Will upgrade to PG18 when available
    image: docker.io/library/postgres:17
    container_name: postgres18_ai
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      # Core PostgreSQL settings
      POSTGRES_USER: ${POSTGRES_USER:-ai_dba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AIDBAdmin2025Secure}
      POSTGRES_DB: ${POSTGRES_DB:-ai_control}

      # PostgreSQL 18 configuration (will apply when PG18 is available)
      # These will be used to configure postgresql.conf
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"

      # Performance settings (AI-managed)
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-1000}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-2GB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}

      # WAL & Replication
      POSTGRES_WAL_LEVEL: ${POSTGRES_WAL_LEVEL:-logical}

    volumes:
      # Data persistence
      - postgres_data:/var/lib/postgresql/data:Z
      - postgres_backups:/backups:Z

      # Custom configuration
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:Z
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:Z

      # Initialization scripts
      - ./scripts/init:/docker-entrypoint-initdb.d:Z

    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
      -c track_io_timing=on
      -c track_functions=all
      -c log_statement=all
      -c log_duration=on
      -c log_min_duration_statement=1000
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dba -d ai_control"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      app: "infrastructure-audit"
      component: "database"
      managed_by: "ai_agents"
      version: "18.0"

  # Prometheus PostgreSQL Exporter for monitoring
  postgres_exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_ai
    restart: unless-stopped

    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-ai_dba}:${POSTGRES_PASSWORD:-AIDBAdmin2025Secure}@postgres18:5432/${POSTGRES_DB:-ai_control}?sslmode=disable"

    depends_on:
      postgres18:
        condition: service_healthy

    labels:
      app: "infrastructure-audit"
      component: "monitoring"