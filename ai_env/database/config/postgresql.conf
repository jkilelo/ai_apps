# PostgreSQL 18 Configuration for AI-Driven Management
# Following AI_DRIVEN_POSTGRESQL_AUDIT.md specifications
# This configuration is optimized for AI workloads and autonomous management

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

max_connections = 1000                   # AI agents + application connections
superuser_reserved_connections = 50      # Reserved for AI DBA agents

#------------------------------------------------------------------------------
# RESOURCE USAGE (AI-tuned)
#------------------------------------------------------------------------------

# Memory Settings (will be dynamically adjusted by AI)
shared_buffers = 2GB                    # Starting value, AI will optimize
huge_pages = try                        # Use huge pages if available
effective_cache_size = 6GB              # AI will adjust based on system
maintenance_work_mem = 512MB            # For VACUUM, CREATE INDEX, etc.
work_mem = 16MB                         # Per operation memory

# Asynchronous I/O - PostgreSQL 18 feature
# (These settings will be active when PG18 is available)
# async_io = on                         # Enable async I/O
# async_io_backend = io_uring           # Use io_uring on Linux
# async_io_workers = 8                  # Number of I/O worker threads

#------------------------------------------------------------------------------
# WRITE AHEAD LOG
#------------------------------------------------------------------------------

wal_level = logical                     # Required for logical replication
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on
archive_mode = on
archive_command = 'cp %p /backups/wal_archive/%f'

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

random_page_cost = 1.1                  # SSD optimized
effective_io_concurrency = 200          # SSD optimized
default_statistics_target = 100         # Default statistics

# PostgreSQL 18 features (when available)
# enable_skip_scan = on                 # Enable skip scan for multicolumn indexes
# enable_virtual_columns = on           # Use virtual generated columns

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

# Where to log
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = default
log_hostname = on
log_statement = 'all'
log_min_duration_statement = 1000       # Log slow queries > 1s

# Performance logging
log_autovacuum_min_duration = 0
log_lock_waits = on
log_temp_files = 0

#------------------------------------------------------------------------------
# STATISTICS
#------------------------------------------------------------------------------

track_activities = on
track_counts = on
track_io_timing = on                    # Critical for AI performance analysis
track_wal_io_timing = on                # PG18 feature
track_functions = all
track_activity_query_size = 4096

# pg_stat_statements extension
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

#------------------------------------------------------------------------------
# AUTOVACUUM (AI-managed)
#------------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------

ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on

# Row Level Security
row_security = on

#------------------------------------------------------------------------------
# AI AGENT SETTINGS
#------------------------------------------------------------------------------

# Custom settings for AI management (using custom GUCs)
# ai.monitoring_interval = 60s          # How often AI checks system health
# ai.decision_threshold = 0.7           # Minimum confidence for AI actions
# ai.learning_enabled = on              # Enable continuous learning
# ai.autonomous_mode = on               # Full autonomous operation