[project]
name = "ui-testing-framework-v3"
version = "3.0.0"
description = "Production-grade UI Testing Framework with Hexagonal Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "UI Testing Framework Team", email = "team@ui-testing.dev" },
]
keywords = [
    "testing",
    "ui",
    "automation",
    "hexagonal",
    "architecture",
    "qa",
    "playwright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = ["playwright>=1.40.0", "langgraph>=0.0.20", "pydantic>=2.5.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "ipython>=8.18.0",
    "rich>=13.7.0",
]

llm = ["openai>=1.6.0", "anthropic>=0.8.0", "google-generativeai>=0.3.0"]

all = ["ui-testing-framework-v3[dev]", "ui-testing-framework-v3[llm]"]

[project.scripts]
ui-testing = "api.cli:main"

[project.entry-points."ui_testing_framework.plugins"]
stealth = "adapters.browser.stealth:register"
llm_formatter = "adapters.formatters.llm_test:register"
sqlite_storage = "adapters.storage.sqlite:register"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "core",
    "ports",
    "adapters",
    "plugins",
    "application",
    "infrastructure",
    "api",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | __pycache__
  | data
  | logs
  | htmlcov
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "PERF", # perflint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "S101",    # use of assert (needed for tests)
    "PLR0913", # too many arguments
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "PLR0913"]
"plugins/*" = ["ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["playwright.*", "langgraph.*", "pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=ui_testing_framework_v3",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=95",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["ui_testing_framework_v3"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
    "proof_of_concept.py",
    "llm.py",
    "ui_testing_framework_v3/__main__.py",
    "ui_testing_framework_v3/application/pipeline.py",
    # Adapters with external side-effects or non-deterministic behavior
    "ui_testing_framework_v3/adapters/browser/*",
    "ui_testing_framework_v3/adapters/generators/llm_based.py",
    "ui_testing_framework_v3/adapters/storage/*",
    "ui_testing_framework_v3/infrastructure/*",
    "ui_testing_framework_v3/plugins/*",
]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
    "proof_of_concept.py",
    "llm.py",
    "ui_testing_framework_v3/__main__.py",
    "ui_testing_framework_v3/application/pipeline.py",
    # Adapters with external side-effects or non-deterministic behavior
    "ui_testing_framework_v3/adapters/browser/*",
    "ui_testing_framework_v3/adapters/generators/llm_based.py",
    "ui_testing_framework_v3/adapters/storage/*",
    "ui_testing_framework_v3/infrastructure/*",
    "ui_testing_framework_v3/plugins/*",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
