name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    services:
      # FalkorDB (Redis with graph module)
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      # Meilisearch
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest-xdist  # For parallel testing
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Wait for services
      run: |
        sleep 10
        # Test FalkorDB connection
        python -c "import redis; r = redis.Redis(host='localhost', port=6379); print('FalkorDB:', r.ping())"
        # Test Meilisearch connection  
        curl -f http://localhost:7700/health || exit 1
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing
      env:
        FALKORDB_HOST: localhost
        FALKORDB_PORT: 6379
        MEILISEARCH_HOST: localhost
        MEILISEARCH_PORT: 7700
        MEILISEARCH_MASTER_KEY: test_master_key
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
      env:
        FALKORDB_HOST: localhost
        FALKORDB_PORT: 6379
        MEILISEARCH_HOST: localhost
        MEILISEARCH_PORT: 7700
        MEILISEARCH_MASTER_KEY: test_master_key
    
    - name: Run stealth tests (headless only)
      run: |
        pytest tests/stealth/ -v -m "not slow"
      env:
        BROWSER_HEADLESS: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install quality tools
      run: |
        pip install ruff mypy bandit safety
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/ --output-format=github
    
    - name: Format check with ruff
      run: |
        ruff format src/ tests/ --check
    
    - name: Type check with mypy
      run: |
        mypy src/ --strict --ignore-missing-imports --show-error-codes
    
    - name: Security scan with bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json
        # Don't fail on security issues, just report
        bandit -r src/ || true
    
    - name: Dependency vulnerability check
      run: |
        safety check --json --output safety-report.json
        # Don't fail on vulnerabilities, just report  
        safety check || true
    
    - name: Upload security artifacts
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
      if: always()

  stealth-validation:
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run comprehensive stealth tests
      run: |
        pytest tests/stealth/ -v --tb=short
      env:
        BROWSER_HEADLESS: true
        STEALTH_MODE: enabled
    
    - name: Test against bot detection sites
      run: |
        python -c "
import asyncio
from src.main import AIBrowserAgent

async def test_stealth():
    agent = AIBrowserAgent(config={'headless': True, 'stealth': True})
    sites = [
        'https://bot.sannysoft.com',
        'https://arh.antoinevastel.com/bots/areyouheadless'
    ]
    
    for site in sites:
        try:
            result = await agent.test_stealth_site(site)
            print(f'{site}: {\"PASS\" if result[\"success\"] else \"FAIL\"}')
        except Exception as e:
            print(f'{site}: ERROR - {e}')

asyncio.run(test_stealth())
        " || echo "Stealth validation completed with warnings"

  build-docs:
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install documentation tools
      run: |
        pip install mkdocs mkdocs-material mkdocstrings[python]
    
    - name: Build documentation
      run: |
        mkdocs build --strict
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: site/
    
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

  performance-benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark hyperfine
    
    - name: Install Playwright
      run: |
        playwright install chromium
        playwright install-deps
    
    - name: Run performance benchmarks
      run: |
        python benchmarks/performance.py || echo "No benchmarks found"
        # Alternative: Run with hyperfine
        hyperfine --warmup 3 --runs 10 \
          "python src/main.py --benchmark --headless" \
          --export-json benchmark-results.json || echo "Manual benchmark completed"
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark-results.json
      if: always()

  notify:
    runs-on: ubuntu-latest
    needs: [test, quality, stealth-validation]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.test.result == 'success' && needs.quality.result == 'success'
      run: |
        echo "✅ All checks passed! Ready for deployment."
    
    - name: Notify on failure
      if: needs.test.result == 'failure' || needs.quality.result == 'failure'
      run: |
        echo "❌ Some checks failed. Please review the logs."
        exit 1